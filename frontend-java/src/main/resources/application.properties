server.port=8081
spring.application.name=shopnow-frontend

# Base URL of the Node.js backend (business logic tier)
backend.api.baseurl=${BACKEND_API_URL:http://localhost:4000}

# Actuator health endpoint - used later by k8s liveness/readiness probes
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
