<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopNow — Shop Smart, Shop Now</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a href="/" class="logo">Shop<span>Now</span></a>
        <form class="search-wrap" action="/" method="get">
            <input type="text" name="search" th:value="${searchTerm}" placeholder="Search for products, brands and more" />
            <input type="hidden" name="category" th:value="${selectedCategory}" />
            <button type="submit">🔍</button>
        </form>
    </div>
</header>

<div class="category-bar">
    <a href="/" class="cat-chip" th:classappend="${selectedCategory == ''} ? ' active'">All</a>
    <a href="/?category=Electronics" class="cat-chip" th:classappend="${selectedCategory == 'Electronics'} ? ' active'">Electronics</a>
    <a href="/?category=Fashion" class="cat-chip" th:classappend="${selectedCategory == 'Fashion'} ? ' active'">Fashion</a>
    <a href="/?category=Home %26 Kitchen" class="cat-chip" th:classappend="${selectedCategory == 'Home & Kitchen'} ? ' active'">Home &amp; Kitchen</a>
    <a href="/?category=Sports" class="cat-chip" th:classappend="${selectedCategory == 'Sports'} ? ' active'">Sports</a>
</div>

<main class="container">
    <h2 class="section-title">Today's Deals</h2>
    <div class="product-grid" th:if="${!products.isEmpty()}">
        <a class="product-card" th:each="p : ${products}" th:href="@{'/product/' + ${p.id}}">
            <img th:src="${p.image}" alt="" />
            <div class="product-name" th:text="${p.name}">Product name</div>
            <div class="product-rating" th:text="'★ ' + ${p.rating} + ' (' + ${p.reviews} + ')'">rating</div>
            <div>
                <span class="product-price" th:text="'₹' + ${p.price}">price</span>
                <span class="product-mrp" th:text="'₹' + ${p.mrp}">mrp</span>
            </div>
        </a>
    </div>
    <p th:if="${products.isEmpty()}" style="padding:20px;color:#878787;">No products found.</p>
</main>

<footer class="footer">
    <p>ShopNow — 3-tier demo (Java/Spring Boot frontend → Node.js backend → PostgreSQL) built for a real-time DevOps CI/CD project</p>
</footer>
</body>
</html>
